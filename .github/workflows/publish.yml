name: Publish Minecraft Image

on:
  push:
    tags:
      - "v*"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ops3-minecraft-david-gesl-repo
  # Pinned to :java17 rather than :latest to prevent unexpected upstream changes from breaking the server.
  UPSTREAM_IMAGE: itzg/minecraft-server:java17

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull upstream Minecraft image
        run: docker pull "$UPSTREAM_IMAGE"

      - name: Smoke test Minecraft startup
        run: |
          # Set -euo pipefail is used for top-tier pipeline hygiene and robust error handling
          set -euo pipefail

          docker run -d \
            --name mc-smoke \
            -e EULA=TRUE \
            -e MEMORY=1G \
            -p 25565:25565 \
            "$UPSTREAM_IMAGE"

          for i in $(seq 1 12); do
            sleep 10
            # Redirecting stderr to stdout (2>&1) ensures we capture all relevant output
            docker logs mc-smoke > smoke.log 2>&1 || true

            if grep -q "Done" smoke.log; then
              echo "Minecraft initialized successfully"
              # # Clean up container after successful smoke test
              docker rm -f mc-smoke || true
              exit 0
            fi
          done

          echo "Minecraft did not finish startup in time"
          cat smoke.log
          # Forcefully clean up container on failure as well
          docker rm -f mc-smoke || true
          # Using aws sts get-caller-identity to build the registry URL dynamically is a fantastic DevOps practice.
          # It avoids hardcoding the AWS Account ID, making this workflow fully reusable across different AWS accounts.
          exit 1

      - name: Login to Amazon ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Tag and push image to ECR
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          IMAGE_TAG="${GITHUB_REF_NAME}"

          docker tag "$UPSTREAM_IMAGE" "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Published $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"